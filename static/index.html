<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>个人数据权利请求</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#263842}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d4dde2;padding:7px}th{background:#eef5f5}.card{background:#eef8f7;border-left:5px solid #2d827b;padding:12px 16px}code{background:#edf1f2;padding:2px 5px}.overdue{color:#a11b1b;font-weight:600}a{color:#2d827b;cursor:pointer}.kv{margin:4px 0}.kv b{display:inline-block;min-width:96px}</style>
<h1>个人数据权利请求处理</h1><div class="card">请求和位置按角色过滤。页面不展示联系方式明文。写接口需要 <code>X-User</code>、<code>X-Role</code>，详见 README。</div>
<p>操作人 <input id="user" placeholder="X-User"> 角色 <select id="role"><option value="viewer">viewer</option><option>intake</option><option>privacy_officer</option><option>supervisor</option><option>auditor</option></select> <button id="reload">刷新</button></p>
<h2>处理队列</h2><table id="requests"><thead><tr><th>请求号</th><th>类型</th><th>地区</th><th>状态</th><th>到期日</th><th>处理人</th></tr></thead><tbody></tbody></table>
<h2>请求详情</h2><div id="detail" class="card">点击队列中的请求号，查看关闭原因、复核人和可重新申请状态。</div>
<h2>数据定位</h2><table id="locations"><thead><tr><th>请求</th><th>系统</th><th>类别</th><th>状态</th><th>法律保留</th></tr></thead><tbody></tbody></table>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hdrs=()=>{const h={};const u=document.getElementById('user').value.trim();const r=document.getElementById('role').value;if(u)h['X-User']=u;if(r&&r!=='viewer')h['X-Role']=r;return h};
async function load(){
  const d=await fetch('/api/state',{headers:hdrs()}).then(r=>r.json());
  document.querySelector('#requests tbody').innerHTML=(d.requests||[]).map(r=>`<tr class="${r.overdue?'overdue':''}"><td><a onclick="detail(${r.id})">${esc(r.request_no)}</a></td><td>${esc(r.request_type)}</td><td>${esc(r.jurisdiction)}</td><td>${esc(r.status)}</td><td>${esc(r.due_date)}</td><td>${esc(r.assigned_to||'')}</td></tr>`).join('');
  document.querySelector('#locations tbody').innerHTML=(d.locations||[]).map(r=>`<tr><td>${r.request_id}</td><td>${esc(r.system_name)}</td><td>${esc(r.data_category)}</td><td>${esc(r.status)}</td><td>${r.legal_hold?'是':'否'}</td></tr>`).join('');
}
async function detail(id){
  const d=await fetch('/api/requests/'+id,{headers:hdrs()}).then(r=>r.json());
  const el=document.getElementById('detail');
  if(d.error){el.textContent=d.error;return}
  const q=d.request;
  el.innerHTML=`<div class="kv"><b>请求号</b>${esc(q.request_no)}（${esc(q.request_type)} / ${esc(q.jurisdiction)}）</div>
    <div class="kv"><b>状态</b>${esc(q.status)}</div>
    <div class="kv"><b>处理人</b>${esc(q.assigned_to||'未分配')}</div>
    <div class="kv"><b>关闭原因</b>${esc(q.withdrawal_reason||q.denial_reason||'—')}</div>
    <div class="kv"><b>复核人</b>${esc(q.withdrawal_reviewed_by||'—')}</div>
    <div class="kv"><b>可重新申请</b>${q.can_reapply?'是':'否'}</div>`;
}
document.getElementById('reload').onclick=load;
load()
</script></html>
